<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OTA 固件管理 · miiocli</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="site-header">
    <div class="topbar">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span><span>miiocli</span></a>
      <nav class="nav" aria-label="主菜单">
        <a href="/">首页</a>
        <a class="active" href="/ota">OTA</a>
        <a href="/webapp">Web App</a>
        <a href="/websocket">WebSocket</a>
        <a href="/codex">Codex</a>
      </nav>
      <div class="header-side auth-bar">
        <input id="token" type="password" autocomplete="current-password" placeholder="管理员 Token" aria-label="管理员 Token">
        <button class="button" id="saveToken">连接</button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="page-head">
      <div>
        <p class="eyebrow">Firmware Releases</p>
        <h1>OTA 固件管理</h1>
        <p class="lead">发布经过 ESP-IDF 版本校验的固件，并管理 Stable 与 Beta 更新通道。</p>
      </div>
    </div>

    <section class="section">
      <div class="section-heading"><div><h2>发布固件</h2><p>固件内嵌版本必须与填写的版本号一致</p></div></div>
      <form id="uploadForm" class="form-grid">
        <label class="field firmware">固件文件<input name="firmware" type="file" accept=".bin,application/octet-stream" required></label>
        <label class="field">版本<input name="version" placeholder="1.1.0" pattern="v?[0-9]+(\.[0-9]+){0,3}(-[A-Za-z0-9.-]+)?" required></label>
        <label class="field">通道<select name="channel"><option value="stable">Stable</option><option value="beta">Beta</option></select></label>
        <label class="checkbox"><input name="mandatory" type="checkbox">强制升级</label>
        <label class="field span-3">发布说明<textarea name="notes" rows="3" maxlength="500" placeholder="说明本次版本的主要变更" required></textarea></label>
        <button class="button primary" type="submit">发布版本</button>
      </form>
    </section>

    <section class="section">
      <div class="toolbar">
        <div><h2>版本列表</h2><div class="status-line" id="status">尚未连接</div></div>
        <button class="button icon-button" id="refresh" title="刷新" aria-label="刷新">↻</button>
      </div>
      <table class="data-table">
        <thead><tr><th style="width:14%">版本</th><th style="width:11%">通道</th><th style="width:15%">大小 / 校验</th><th>发布说明</th><th style="width:18%">发布时间</th><th style="width:72px"></th></tr></thead>
        <tbody id="releaseRows"><tr><td colspan="6" class="empty">暂无数据</td></tr></tbody>
      </table>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script>
    const byID = (id) => document.getElementById(id);
    const tokenInput = byID("token");
    const rows = byID("releaseRows");
    const status = byID("status");
    const form = byID("uploadForm");
    tokenInput.value = sessionStorage.getItem("ota_token") || "";

    const headers = () => ({ "Authorization": `Bearer ${tokenInput.value}` });
    function showToast(message, error = false) {
      const element = byID("toast");
      element.textContent = message;
      element.className = `toast${error ? " error" : ""}`;
      element.style.display = "block";
      setTimeout(() => { element.style.display = "none"; }, 3200);
    }
    function formatSize(bytes) {
      return bytes < 1048576 ? `${(bytes / 1024).toFixed(0)} KB` : `${(bytes / 1048576).toFixed(2)} MB`;
    }
    function escapeHTML(value) {
      const element = document.createElement("span");
      element.textContent = value || "";
      return element.innerHTML;
    }

    async function loadReleases() {
      status.textContent = "正在加载...";
      try {
        const response = await fetch("/v1/ota/releases", { headers: headers() });
        if (!response.ok) throw new Error(response.status === 401 ? "管理员 Token 无效" : `加载失败 (${response.status})`);
        const data = await response.json();
        status.textContent = `共 ${data.releases.length} 个版本`;
        rows.innerHTML = data.releases.length ? data.releases.map((release) => `<tr>
          <td><span class="mono">${escapeHTML(release.version)}</span> ${release.mandatory ? '<span class="mandatory">强制</span>' : ""}</td>
          <td><span class="badge ${release.channel === "beta" ? "beta" : ""}">${escapeHTML(release.channel)}</span></td>
          <td>${formatSize(release.size)}<br><span class="hash mono" title="${release.sha256}">${release.sha256.slice(0, 12)}...</span></td>
          <td>${escapeHTML(release.notes) || '<span class="muted">-</span>'}</td>
          <td>${new Date(release.created_at).toLocaleString()}</td>
          <td><button class="button danger" data-delete="${release.id}">删除</button></td>
        </tr>`).join("") : '<tr><td colspan="6" class="empty">暂无版本</td></tr>';
      } catch (error) {
        status.textContent = error.message;
        rows.innerHTML = '<tr><td colspan="6" class="empty">无法加载版本</td></tr>';
        showToast(error.message, true);
      }
    }

    byID("saveToken").addEventListener("click", () => {
      sessionStorage.setItem("ota_token", tokenInput.value);
      loadReleases();
    });
    byID("refresh").addEventListener("click", loadReleases);
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = form.querySelector("button[type=submit]");
      button.disabled = true;
      const data = new FormData(form);
      data.set("mandatory", form.elements.mandatory.checked ? "true" : "false");
      try {
        const response = await fetch("/v1/ota/releases", { method: "POST", headers: headers(), body: data });
        if (!response.ok) throw new Error((await response.text()).trim() || "发布失败");
        form.reset();
        showToast("版本已发布");
        await loadReleases();
      } catch (error) {
        showToast(error.message, true);
      } finally {
        button.disabled = false;
      }
    });
    rows.addEventListener("click", async (event) => {
      const button = event.target.closest("[data-delete]");
      if (!button || !confirm("确定删除这个版本？")) return;
      button.disabled = true;
      const response = await fetch(`/v1/ota/releases/${encodeURIComponent(button.dataset.delete)}`, { method: "DELETE", headers: headers() });
      if (response.ok) {
        showToast("版本已删除");
        loadReleases();
      } else {
        button.disabled = false;
        showToast("删除失败", true);
      }
    });
    if (tokenInput.value) loadReleases();
  </script>
</body>
</html>
